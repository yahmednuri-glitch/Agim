<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أڴم - Agem | منصة التوثيق التفاعلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Tifinagh&display=swap" rel="stylesheet">
    <style>
        :root { --am-blue: #008eb0; --am-green: #bed62f; --am-yellow: #fbd305; }
        body { margin:0; background:black; overflow:hidden; font-family: 'Noto Sans Arabic', 'Noto Sans Tifinagh', sans-serif; direction: rtl; }
        .slide { position:absolute; width:100%; height:100%; opacity:0; transition: opacity 0.8s ease; display:flex; align-items:center; justify-content:center; }
        .slide.active { opacity:1; }
        .slide img, .slide video { width:100%; height:100%; object-fit:cover; }
        .overlay-text { position: absolute; z-index: 2; bottom: 15%; text-align: center; color: white; font-size: 28px; text-shadow: 0 4px 15px rgba(0,0,0,0.9); max-width: 90%; font-weight: bold; }
        .decision-overlay { position: absolute; z-index: 100; display: flex; flex-direction: column; gap: 15px; width: 80%; max-width: 350px; }
        .decision-btn { background: rgba(0, 142, 176, 0.85); color: white; padding: 18px; border-radius: 15px; border: 2px solid white; cursor: pointer; text-align: center; backdrop-filter: blur(8px); font-weight: bold; transition: 0.3s; animation: fadeInUp 0.8s ease; }
        .decision-btn:hover { background: var(--am-green); transform: scale(1.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .brand { position: fixed; top: 20px; right: 20px; z-index: 50; color: white; font-weight: bold; font-size: 22px; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .brand span { color: var(--am-blue); font-size: 26px; }
    </style>
</head>
<body>

    <div class="brand"><span>ⵣ</span> أڴم | Agem</div>
    <div id="slides"></div>

    <script>
        let slidesData = [];

        async function loadContent() {
            try {
                const response = await fetch('data.json');
                slidesData = await response.json();
                renderSlide("start"); // نبدأ بالمشهد الذي يحمل ID باسم start
            } catch (e) {
                document.getElementById('slides').innerHTML = '<div style="color:white;text-align:center;padding:50px;">جاري تحميل المحتوى... تأكد من وجود ملف data.json</div>';
            }
        }

        function renderSlide(id) {
            const data = slidesData.find(s => s.id === id) || slidesData[0];
            const container = document.getElementById("slides");
            container.innerHTML = '';

            const slideDiv = document.createElement('div');
            slideDiv.className = 'slide active';

            if (data.type === 'video') {
                slideDiv.innerHTML = `<video src="${data.src}" autoplay muted playsinline loop></video>`;
            } else {
                slideDiv.innerHTML = `<img src="${data.src}">`;
            }

            if (data.content) {
                const txt = document.createElement('div');
                txt.className = 'overlay-text';
                txt.innerText = data.content;
                slideDiv.appendChild(txt);
            }

            if (data.options) {
                const overlay = document.createElement('div');
                overlay.className = 'decision-overlay';
                data.options.forEach(opt => {
                    const btn = document.createElement('div');
                    btn.className = 'decision-btn';
                    btn.innerText = opt.text;
                    btn.onclick = () => renderSlide(opt.targetId);
                    overlay.appendChild(btn);
                });
                slideDiv.appendChild(overlay);
            }
            container.appendChild(slideDiv);
        }

        loadContent();
    </script>
</body>
</html>
